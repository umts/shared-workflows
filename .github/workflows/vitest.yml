on:
  workflow_call:
jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: (grep -q '"playwright"' package.json && npx playwright install --with-deps) || true
      - run: npx vitest run
