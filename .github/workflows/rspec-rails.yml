on:
  workflow_call:
jobs:
  rspec:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.6@sha256:f1c56f035ed268a0d7c2c2e06dc879f6319b997cb434cf822a4cfd72a7aa184d
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1
        ports:
          - 3306:3306
    env:
      RAILS_ENV: test
      DATABASE_URL: trilogy://root@127.0.0.1:3306/rails_test
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: bin/rails db:create db:schema:load test:prepare
      - run: bundle exec rspec
